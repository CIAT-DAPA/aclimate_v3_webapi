[project]
name = "aclimate-v3-webapi"
version = "3.0.0"
description = "REST API for the AClimate v3 platform: administrative levels, locations, climate data and indicators."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "CIAT-DAPA" }
]
# Runtime dependencies (direct imports of the application and its drivers).
dependencies = [
  # AClimate internal packages (resolved from git, see [tool.uv.sources])
  "aclimate-v3-orm",
  "aclimate-v3-cut-spatial-data",
  # Web framework and server
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
  "python-multipart==0.0.20",
  # Validation and configuration
  "pydantic==2.11.4",
  "email-validator==2.2.0",
  "python-dotenv==1.1.0",
  # Database
  "sqlalchemy==2.0.41",
  "psycopg2==2.9.10",
  # Authentication (Keycloak tokens)
  "python-jose==3.4.0",
  "pyjwt==2.10.1",
  "cryptography==45.0.2",
  # HTTP clients
  "httpx==0.28.1",
  "requests==2.32.3",
  "urllib3==2.4.0",
  # Geospatial stack (GeoServer raster/point endpoints)
  "rasterio>=1.3.0",
  "geopandas>=0.14.0",
  "numpy>=1.24.0",
  "rioxarray==0.19.0",
  "shapely==2.1.1",
  "zipstream-new>=1.1.8",
]

# Development-only dependencies (tests). Installed by default with `uv sync`,
# excluded in production with `uv sync --no-dev`.
[dependency-groups]
dev = [
  "pytest==8.4.0",
  "requests-mock==1.12.1",
  "respx==0.22.0",
]

[tool.uv]
# This repository is an application (not an installable package).
package = false

[tool.uv.sources]
aclimate-v3-orm = { git = "https://github.com/CIAT-DAPA/aclimate_v3_orm" }
aclimate-v3-cut-spatial-data = { git = "https://github.com/CIAT-DAPA/aclimate_v3_cut_spatial_data" }

[tool.pytest.ini_options]
# `src` is added to sys.path so tests can import `main`, `routes`, `schemas`, etc.
pythonpath = ["src"]
testpaths = ["src/tests"]
